name: sms-relay
services:
  gateway:
    image: ${RELAY_IMAGE:?Deployment image required}
    env_file: /opt/sms-relay/shared/.env
    environment:
      RELAY_DATABASE: /app/data/relay.sqlite3
      RELAY_ALLOW_INSECURE_LOCAL: "false"
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - /opt/sms-relay/shared/data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 256m
    cpus: 0.75
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: "10m", max-file: "3"}
