name: Relay checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project gateway --extra test --locked pytest gateway/tests -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable phone signing identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SMS_PRODUCTION_ENABLED == 'true'
        env:
          PHONE_KEYSTORE: ${{ secrets.SMS_ANDROID_KEYSTORE }}
        run: |
          test -n "$PHONE_KEYSTORE"
          printf '%s' "$PHONE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/phone.keystore"
          chmod 600 "$RUNNER_TEMP/phone.keystore"
          echo "RELAY_DEBUG_KEYSTORE=$RUNNER_TEMP/phone.keystore" >> "$GITHUB_ENV"
      - run: cd android && ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Sign release manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SMS_PRODUCTION_ENABLED == 'true'
        env:
          UPDATE_KEY: ${{ secrets.SMS_UPDATE_SIGNING_KEY }}
        run: |
          printf '%s' "$UPDATE_KEY" > "$RUNNER_TEMP/update.pem"
          chmod 600 "$RUNNER_TEMP/update.pem"
          trap 'rm -f "$RUNNER_TEMP/update.pem" "$RUNNER_TEMP/phone.keystore"' EXIT
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          python scripts/publish_app.py --apk android/app/build/outputs/apk/debug/app-debug.apk --key "$RUNNER_TEMP/update.pem" --code "$CODE" --version "$VERSION" --out ota-release
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SMS_PRODUCTION_ENABLED == 'true'
        with:
          name: ota-release
          path: ota-release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sms-relay-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  deploy:
    needs: [gateway, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SMS_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ota-release
          path: ota-release
      - name: Deploy isolated gateway
        env:
          DEPLOY_KEY: ${{ secrets.SMS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.SMS_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SMS_DEPLOY_KNOWN_HOSTS }}
          HEALTH_URL: ${{ vars.SMS_HEALTH_URL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sms-deploy
          chmod 600 ~/.ssh/sms-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/sms-deploy' EXIT
          python scripts/bundle_release.py | ssh -i ~/.ssh/sms-deploy -o BatchMode=yes -o StrictHostKeyChecking=yes sms-relay-deploy@"$DEPLOY_HOST" deploy
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$HEALTH_URL"
