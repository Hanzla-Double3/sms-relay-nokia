services:
  gateway:
    build: ./gateway
    env_file: .env
    environment:
      RELAY_DATABASE: /app/data/relay.sqlite3
      RELAY_ALLOW_INSECURE_LOCAL: "false"
    volumes:
      - relay-data:/app/data
    networks: [relay]
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./docs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [relay]
    restart: unless-stopped
networks:
  relay:
volumes:
  relay-data:
  caddy-data:
  caddy-config:
