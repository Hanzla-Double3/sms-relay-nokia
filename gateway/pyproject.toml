[project]
name = "nokia-sms-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "websockets>=14,<17"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["relay"]
[tool.pytest.ini_options]
testpaths = ["tests"]
